<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MetaDeck - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Login-Specific Styles ──────────────────────────── */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative background spotlights */
    .login-wrapper::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: glow-pulse 4s ease-in-out infinite;
    }
    .login-wrapper::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.06) 0%, transparent 70%);
      pointer-events: none;
      animation: glow-pulse 5s ease-in-out infinite reverse;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-xl);
      padding: 40px 32px 32px;
      box-shadow: var(--shadow-elevated);
      position: relative;
      animation: fadeInUp 0.6s var(--ease-out);
    }

    /* Gold accent line at top of card */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      border-radius: var(--radius-full);
    }

    /* Brand area */
    .login-brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: var(--radius-full);
      margin-bottom: 16px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .login-brand h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--text-main) 30%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .login-brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* Toggle password button override */
    #toggle-pw {
      position: absolute;
      right: 8px;
      top: 36px;
      background: transparent !important;
      color: var(--text-muted);
      border: none !important;
      box-shadow: none !important;
      padding: 4px 8px;
      height: auto;
      min-width: auto;
    }
    #toggle-pw::before { display: none; }
    #toggle-pw:hover {
      color: var(--primary);
      transform: none;
      box-shadow: none !important;
    }

    /* Login button special */
    #submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-top: 4px;
    }

    .login-footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-badge"><i class="fa-solid fa-futbol"></i> Squad Portal</div>
        <h1>MetaDeck</h1>
        <p>Rate your squad. Build your cards.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required placeholder="Enter your username">
        </div>
        <div class="form-group" style="position: relative;">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password" style="padding-right: 80px;">
          <button type="button" id="toggle-pw" aria-label="Show password">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <button type="submit" id="submit-btn">Login</button>
      </form>

      <div id="alert-box" class="alert"><span id="alert-msg"></span></div>

      <div class="login-footer">Made by Ammar Bakr</div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
