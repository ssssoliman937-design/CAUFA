<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MetaDeck - Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app-container">
    <div id="app-header" class="header">
      <div class="brand-logo">
        <i class="fa-solid fa-bolt"></i>
        <h2>METADECK</h2>
      </div>
      <div class="header-actions">
        <div class="menu-wrapper">
          <button id="menu-btn" class="user-menu-btn" aria-label="Toggle User Menu">
            <i class="fa-solid fa-circle-user avatar-icon"></i>
            <span id="header-username"></span>
            <i class="fa-solid fa-chevron-down chevron-icon"></i>
          </button>
          <div id="dropdown-menu" class="dropdown-menu">
            <a href="dashboard.html" class="dropdown-item"><i class="fa-solid fa-house"></i> Home</a>
            <a href="admin.html" id="header-admin-link" class="dropdown-item hidden"><i class="fa-solid fa-gear"></i> Admin Panel</a>
            <a href="preview.html" class="dropdown-item hidden"><i class="fa-solid fa-mobile-screen"></i> Card Preview</a>
            <button id="logout-btn" class="dropdown-item danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
      </div>
    </div>

    <div id="screen-loading" class="screen active">
      <div class="loading-spinner"></div>
      <p>Loading...</p>
    </div>

    <div id="screen-intro" class="screen">
      <div class="intro-card-header">
        <div class="intro-live-badge">
          <span class="pulse-dot"></span> SQUAD RATING SESSION
        </div>
        <h2 id="intro-greeting">Welcome, Squad!</h2>
      </div>

      <div class="intro-player-hero">
        <div class="intro-avatar-circle">
          <i class="fa-solid fa-shirt"></i>
        </div>
        <div class="intro-player-info">
          <span class="intro-label">UP NEXT FOR RATING</span>
          <h3 id="intro-player-name">PLAYER NAME</h3>
          <div class="intro-queue-pill">
            <i class="fa-solid fa-layer-group"></i>
            Player <strong id="intro-player-num">1</strong> of <strong id="intro-player-total">10</strong>
          </div>
        </div>
      </div>

      <button id="start-btn" class="btn-start-rating">
        Start Rating Player <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <div id="screen-stat" class="screen">
      <div class="stat-header">
        <div id="stat-progress-fill"></div>
        <div id="stat-player-label">PLAYER 1 OF 10 &middot; <span class="highlight-name">L. MESSI</span></div>
        <strong id="stat-category-badge"></strong>
      </div>

      <div class="stat-info-area" id="stat-info-area">
        <h3 id="stat-name-display"></h3>
        <p id="stat-desc-display"></p>
        <div id="stat-prev-ratings" class="stat-prev-ratings" hidden></div>
      </div>

      <div class="stat-input-area">
        <label>Rating</label>
        <input type="text" id="stat-value-input" inputmode="numeric" value="50" min="40">
        <input type="range" id="stat-slider" min="40" max="99" value="50">
      </div>

      <div class="stat-nav-bar">
        <button id="prev-stat-btn" class="secondary" disabled><i class="fa-solid fa-chevron-left"></i></button>
        <span id="stat-counter"></span>
        <button id="next-stat-btn"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>

    <div id="screen-player-done" class="screen">
      <h2 id="done-player-name"></h2>
      <p id="done-progress-text"></p>
      <button id="continue-btn">Continue</button>
      <button id="logout-for-later-btn" class="secondary">Logout for Later</button>
    </div>

    <div id="screen-waiting" class="screen">
      <h2>Waiting for Squad</h2>
      <p id="waiting-tally-text"></p>
      <button id="logout-waiting-btn" class="secondary">Logout</button>
    </div>

    <div id="screen-results" class="screen">
      <h2>Results</h2>
      <div id="cards-carousel" class="results-carousel"></div>
      <div id="carousel-dots"></div>
      <div style="margin-top: 28px; text-align: center;">
        <button id="btn-share-results" style="width: 100%;">Share Results <i class="fa-solid fa-share-nodes"></i></button>
      </div>
    </div>

    <footer>Made by Ammar Bakr</footer>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
